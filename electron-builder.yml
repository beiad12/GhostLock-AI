appId: ai.ghostlock.app
productName: GhostLock AI
# Use electron-builder's bundled Wine toolset (not any system-installed wine)
# when building Windows targets from Linux/macOS.
toolsets:
  wine: '1.0.1'
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Never package previously-built installer binaries or CI config into the
  # app itself — without this, a committed installer/*.exe gets bundled
  # inside the next build's app.asar and roughly doubles its size.
  - '!installer/**'
  - '!dist/**'
  - '!.github/**'
  # electron-vite fully bundles every renderer dependency (React,
  # framer-motion, zustand, react-router-dom, @vladmandic/face-api, ...)
  # into out/renderer. Only main/preload use externalizeDepsPlugin and need
  # their real raw packages at runtime (systeminformation, @electron-toolkit);
  # everything below is a dead-weight duplicate of code already compiled
  # into out/renderer (face-api's own package alone is ~23MB on top of the
  # ~2.6MB Vite already produced from it; react-dom alone is another ~7MB).
  # Pure negations only — mixing in positive re-include patterns switches
  # electron-builder's "files" into allowlist mode and silently drops the
  # default out/**, package.json, etc. inclusion.
  - '!node_modules/@vladmandic/**'
  - '!node_modules/framer-motion/**'
  - '!node_modules/motion-dom/**'
  - '!node_modules/motion-utils/**'
  - '!node_modules/react/**'
  - '!node_modules/react-dom/**'
  - '!node_modules/react-router/**'
  - '!node_modules/react-router-dom/**'
  - '!node_modules/cookie/**'
  - '!node_modules/set-cookie-parser/**'
  - '!node_modules/clsx/**'
  - '!node_modules/zustand/**'
  - '!node_modules/tslib/**'
asarUnpack:
  - resources/**
  # Face-recognition model weights are fetched at runtime via a relative
  # URL from the renderer — keep them as real files outside the asar
  # archive so that fetch() over file:// resolves them reliably.
  - out/renderer/models/**
win:
  executableName: GhostLock-AI
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: GhostLock AI needs camera access to perform face authentication.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: ghostlock.ai
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
